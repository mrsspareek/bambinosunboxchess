<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bambinos Unbox Chess</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="logo2.png" alt="Bambinos Logo" class="logo" />
  <h2>Bambinos Unbox Chess</h2>
  <p style="color: #94a3b8; font-size: 14px;">Loading Live Arena...</p>
  <div class="spinner"></div>

  <script>
    const targetUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://10.0.2.2:3000' : window.location.origin;
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 300);
  </script>
</body>
</html>
